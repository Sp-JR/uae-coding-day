const FONT = {U:["10001","10001","10001","10001","10001","10001","01110"],E:["11111","10000","10000","11110","10000","10000","11111"],A:["01110","10001","10001","11111","10001","10001","10001"],C:["01111","10000","10000","10000","10000","10000","01111"],O:["01110","10001","10001","10001","10001","10001","01110"],D:["11110","10001","10001","10001","10001","10001","11110"]};
const TXT = "UAE CODE";
function buildLayout(lines, K) {
  const G = 2 * K, w = ln => (ln.length * 6 - 1) * K;
  const cols = Math.max(...lines.map(w)), rows = lines.length * 7 * K + (lines.length - 1) * G;
  const on = new Array(cols * rows).fill(false);
  lines.forEach((ln, li) => {
    const r0 = li * (7 * K + G), c0 = Math.floor((cols - w(ln)) / 2);
    for (let r = 0; r < 7 * K; r++) for (let c = 0; c < w(ln); c++) {
      const fr = Math.floor(r / K), fc = Math.floor(c / K), ch = ln[Math.floor(fc / 6)], cc = fc % 6;
      if (cc < 5 && FONT[ch] && FONT[ch][fr][cc] === "1") on[(r0 + r) * cols + c0 + c] = true;
    }
  });
  const idx = []; on.forEach((v, i) => { if (v) idx.push(i); });
  const rank = {}; idx.slice().sort(() => rnd() - .5).forEach((k, n) => { rank[k] = n; });
  return {cols, rows, total: cols * rows, n: idx.length, rank};
}
const LAY = {stack: buildLayout([TXT], 1), line: buildLayout([TXT], 1)};
const PAL = ["#ff3d6e", "#2ee6a0", "#ffffff", "#3fd8ff"];
function grid(extra, mode) {
  const m = mode || "line", Ly = LAY[m], lit = Math.min(S.count, Ly.n);
  let h = '<div class="board ' + m + '" style="grid-template-columns:repeat(' + Ly.cols + ',1fr)" aria-hidden="true">';
  for (let k = 0; k < Ly.total; k++) {
    const rk = Ly.rank[k];
    if (rk === undefined) { h += '<i class="x"></i>'; continue; }
    if (rk < lit) {
      if (extra && rk === lit - 1) h += '<i class="me"></i>';
      else { const c = PAL[rk % 4]; h += '<i class="on" style="background:' + c + ';color:' + c + '"></i>'; }
    } else h += '<i></i>';
  }
  return h + "</div>";
}

function act(a, v) {

/* ===== شاشة الافتتاح: رموز البرمجة المتحركة (5 ثوانٍ) ===== */
function startScene(cv) {
  const ctx = cv && cv.getContext && cv.getContext("2d");
  if (!ctx) return null;
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const COL = ["#3fd8ff", "#ff6aa8", "#ffc247", "#2ee6a0", "#b58cff"];
  const WORDS = ["</>", "{ }", "[ ]", "01", "10", "IF", "LOOP", "=>", "λ", "#", "AI", "fn()", "0101", "<div>", "while", "++", "&&", ">_", "def", "∑", "{ ; }", "NULL"];
  const rand = (a, b) => a + Math.random() * (b - a);
  let W, H, dpr, syms = [], nodes = [], last = 0, raf = 0, t0 = 0, stopped = false;

  function resize() {
    W = window.innerWidth; H = window.innerHeight; dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const n = W < 700 ? 22 : 38;
    syms = Array.from({length: n}, (_, i) => ({t: WORDS[i % WORDS.length], x: rand(0, W), y: rand(0, H), s: rand(24, W < 700 ? 56 : 100), vx: rand(-14, 14), vy: rand(-10, 10), r: rand(-.5, .5), vr: rand(-.05, .05), c: COL[i % COL.length], a: rand(.16, .34)}));
    syms.forEach(o => {
      const m = document.createElement("canvas"), x = m.getContext("2d");
      x.font = "700 " + Math.round(o.s) + "px 'Courier New',monospace";
      o.w = Math.ceil(x.measureText(o.t).width) + 24; o.h = Math.ceil(o.s * 1.5) + 8;
      m.width = Math.round(o.w * dpr); m.height = Math.round(o.h * dpr);
      x.scale(dpr, dpr); x.font = "700 " + Math.round(o.s) + "px 'Courier New',monospace";
      x.textAlign = "center"; x.textBaseline = "middle"; x.globalAlpha = o.a; x.fillStyle = o.c; x.fillText(o.t, o.w / 2, o.h / 2);
      o.sp = m;
    });
    nodes = Array.from({length: W < 700 ? 14 : 26}, () => ({x: rand(0, W), y: rand(0, H), vx: rand(-8, 8), vy: rand(-8, 8)}));
  }
  function symbols(c, t) {
    c.textAlign = "center"; c.textBaseline = "middle";
    for (const o of syms) {
      c.save(); c.translate(o.x, o.y); c.rotate(o.r + Math.sin(t * .5 + o.s) * .06);
      c.drawImage(o.sp, -o.w / 2, -o.h / 2, o.w, o.h); c.restore();
    }
    c.lineWidth = 1.2;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
      if (d < 230) { c.strokeStyle = "rgba(63,216,255," + (.3 * (1 - d / 230)).toFixed(3) + ")"; c.beginPath(); c.moveTo(nodes[i].x, nodes[i].y); c.lineTo(nodes[j].x, nodes[j].y); c.stroke(); }
    }
    c.fillStyle = "rgba(63,216,255,.6)";
    for (const n of nodes) { c.beginPath(); c.arc(n.x, n.y, 3, 0, 6.283); c.fill(); }
  }
  function step(dt) {
    syms.forEach(o => { o.x += o.vx * dt; o.y += o.vy * dt; o.r += o.vr * dt; if (o.x < -120) o.x = W + 120; if (o.x > W + 120) o.x = -120; if (o.y < -120) o.y = H + 120; if (o.y > H + 120) o.y = -120; });
    nodes.forEach(n => { n.x += n.vx * dt; n.y += n.vy * dt; if (n.x < 0 || n.x > W) n.vx *= -1; if (n.y < 0 || n.y > H) n.vy *= -1; });
  }
  function frame(t) {
    const dt = Math.min(.05, Math.max(0, t - last)); last = t;
    if (!reduce) step(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H); symbols(ctx, t);
  }
  function loop(now) { if (stopped) return; if (!t0) t0 = now; frame((now - t0) / 1000); raf = requestAnimationFrame(loop); }
  resize(); window.addEventListener("resize", resize);
  raf = requestAnimationFrame(loop);
  return {frame, resize, stop() { stopped = true; cancelAnimationFrame(raf); window.removeEventListener("resize", resize); }};
}
(function () {
